name: Playwright E2E Tests

# Optimized triggers to prevent duplicate runs on PR merge
on:
  push:
    branches:
      - main
      - development
      - testing
      - staging
      - production
      - 'releases/**'
  pull_request:
    branches:
      - main
      - development
      - testing
      - staging
      - production
      - 'releases/**'
    types: [opened, synchronize, reopened]

jobs:
  smoke-test:
    name: '🔧 Smoke Test'
    if: |
      github.ref == 'refs/heads/xguo-dev' ||
      github.ref == 'refs/heads/development' ||
      github.ref == 'refs/heads/testing' ||
      (
        github.event_name == 'pull_request' &&
        (
          github.base_ref == 'development' ||
          github.base_ref == 'testing'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: cd angular-app && npm ci

      - name: Start Angular app
        run: |
          cd angular-app
          node_modules/.bin/ng serve --host 0.0.0.0 --port 4200 > /tmp/ng-serve.log 2>&1 &

      - name: Wait for app
        run: npx wait-on http-get://localhost:4200 --timeout 180000 --interval 2000 || (cat /tmp/ng-serve.log && exit 1)

      - name: Run Smoke Tests (local)
        run: npx playwright test --project=smoke-chromium
        env:
          CI: true

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run Smoke Tests (Azure Dashboard)
        run: PLAYWRIGHT_SERVICE_RUN_ID="smoke-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}" npx playwright test --project=smoke-chromium -c playwright.service.config.ts
        env:
          CI: true
          PLAYWRIGHT_SERVICE_URL: ${{ secrets.PLAYWRIGHT_SERVICE_URL }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: playwright-report/
          retention-days: 14

  e2e-multi-browser:
    name: '🚀 E2E - ${{ matrix.browser }}'
    if: |
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/staging' ||
      github.ref == 'refs/heads/production' ||
      startsWith(github.ref, 'refs/heads/releases/') ||
      (
        github.event_name == 'pull_request' &&
        (
          github.base_ref == 'main' ||
          github.base_ref == 'staging' ||
          github.base_ref == 'production' ||
          startsWith(github.base_ref, 'releases/')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            project: e2e-chromium
            deps: chromium
          - browser: firefox
            project: e2e-firefox
            deps: firefox
          - browser: webkit
            project: e2e-webkit
            deps: webkit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.deps }}
      - run: cd angular-app && npm ci

      - name: Start Angular app
        run: |
          cd angular-app
          node_modules/.bin/ng serve --host 0.0.0.0 --port 4200 > /tmp/ng-serve.log 2>&1 &

      - name: Wait for app
        run: npx wait-on http-get://localhost:4200 --timeout 180000 --interval 2000 || (cat /tmp/ng-serve.log && exit 1)

      - name: Run E2E Tests (local)
        run: npx playwright test --project=${{ matrix.project }}
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report-${{ matrix.browser }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: playwright-report/
          retention-days: 30

  azure-dashboard:
    name: '☁️ Azure Dashboard'
    needs:
      - smoke-test
      - e2e-multi-browser
    if: |
      always() && (
        github.ref == 'refs/heads/xguo-dev' ||
        github.ref == 'refs/heads/development' ||
        github.ref == 'refs/heads/testing' ||
        github.ref == 'refs/heads/staging' ||
        github.ref == 'refs/heads/production' ||
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/heads/releases/') ||
        (
          github.event_name == 'pull_request' &&
          (
            github.base_ref == 'development' ||
            github.base_ref == 'testing' ||
            github.base_ref == 'staging' ||
            github.base_ref == 'production' ||
            github.base_ref == 'main' ||
            startsWith(github.base_ref, 'releases/')
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    env:
      CI: true
      PLAYWRIGHT_SERVICE_URL: ${{ secrets.PLAYWRIGHT_SERVICE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: cd angular-app && npm ci

      - name: Start Angular app
        run: |
          cd angular-app
          node_modules/.bin/ng serve --host 0.0.0.0 --port 4200 > /tmp/ng-serve.log 2>&1 &

      - name: Wait for app
        run: npx wait-on http-get://localhost:4200 --timeout 180000 --interval 2000 || (cat /tmp/ng-serve.log && exit 1)

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run Smoke Tests (Azure Dashboard)
        if: |
          github.ref == 'refs/heads/xguo-dev' ||
          github.ref == 'refs/heads/development' ||
          github.ref == 'refs/heads/testing' ||
          (
            github.event_name == 'pull_request' &&
            (
              github.base_ref == 'development' ||
              github.base_ref == 'testing'
            )
          )
        run: PLAYWRIGHT_SERVICE_RUN_ID="smoke-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}" npx playwright test --project=smoke-chromium -c playwright.service.config.ts

      - name: Run All Browsers (Azure Dashboard)
        if: |
          github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/staging' ||
          github.ref == 'refs/heads/production' ||
          startsWith(github.ref, 'refs/heads/releases/') ||
          (
            github.event_name == 'pull_request' &&
            (
              github.base_ref == 'main' ||
              github.base_ref == 'staging' ||
              github.base_ref == 'production' ||
              startsWith(github.base_ref, 'releases/')
            )
          )
        run: PLAYWRIGHT_SERVICE_RUN_ID="e2e-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}" npx playwright test -c playwright.service.config.ts --workers=4

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: azure-dashboard-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: playwright-report/
          retention-days: 30

  quality-gate:
    name: '✅ Quality Gate'
    needs:
      - smoke-test
      - e2e-multi-browser
      - azure-dashboard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate results
        run: |
          echo "Smoke Test:       ${{ needs.smoke-test.result }}"
          echo "E2E Multi-browser:${{ needs.e2e-multi-browser.result }}"
          echo "Azure Dashboard:  ${{ needs.azure-dashboard.result }}"

          FAILED=false
          for result in \
            "${{ needs.smoke-test.result }}" \
            "${{ needs.e2e-multi-browser.result }}" \
            "${{ needs.azure-dashboard.result }}"; do
            if [ "$result" = "failure" ]; then
              FAILED=true
            fi
          done

          if [ "$FAILED" = "true" ]; then
            echo "❌ Quality Gate FAILED"
            exit 1
          fi

          echo "✅ Quality Gate PASSED"

  deploy:
    name: '🚀 Deploy'
    needs: quality-gate
    # Only trigger deployment on push to specific branches, skip during PRs
    if: |
      github.event_name == 'push' && (
        github.ref == 'refs/heads/development' ||
        github.ref == 'refs/heads/testing' ||
        github.ref == 'refs/heads/staging' ||
        github.ref == 'refs/heads/production' ||
        startsWith(github.ref, 'refs/heads/releases/')
      )
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    # Dynamically map Git branches to GitHub Environments to trigger approval flows
    environment:
      name: ${{ github.ref == 'refs/heads/development' && 'Development' || github.ref == 'refs/heads/testing' && 'Testing' || github.ref == 'refs/heads/staging' && 'Staging' || github.ref == 'refs/heads/production' && 'Production' || startsWith(github.ref, 'refs/heads/releases/') && 'Production' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Build Angular app
        run: |
          cd angular-app
          npm ci
          npm run build

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload static site to Azure Storage
        env:
          # TODO: REPLACE WITH YOUR ACTUAL STORAGE ACCOUNT NAME
          STORAGE_ACCOUNT_NAME: pocangularstorage2026
        run: |
          # Verify build output exists
          if [ ! -d "angular-app/dist/angular-app/browser" ]; then
            echo "Build output folder not found: angular-app/dist/angular-app/browser"
            echo "Please verify the Angular dist path in angular.json or package scripts."
            exit 1
          fi

          # Upload all generated static files to the $web container using OIDC auth.
          az storage blob upload-batch \
            --account-name "$STORAGE_ACCOUNT_NAME" \
            --destination '$web' \
            --source "angular-app/dist/angular-app/browser" \
            --overwrite \
            --auth-mode login

      - name: Show static website endpoint
        env:
          # TODO: REPLACE WITH YOUR ACTUAL STORAGE ACCOUNT NAME
          STORAGE_ACCOUNT_NAME: pocangularstorage2026
        run: |
          # Fetch and print the static website URL dynamically
          echo "Deployment completed."
          ENDPOINT=$(az storage account show \
            --name "$STORAGE_ACCOUNT_NAME" \
            --query "primaryEndpoints.web" \
            --output tsv)
          echo "Static website URL: $ENDPOINT"
