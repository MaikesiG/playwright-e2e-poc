name: Playwright E2E Tests

on:
  push:
    branches: [main, dev, xguo-dev]
  pull_request:
    branches: [main, dev]

jobs:
  smoke-test:
    name: '🔧 Smoke Test'
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/xguo-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Testing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: cd angular-app && npm ci

      - name: Start Angular app
        run: |
          cd angular-app
          node_modules/.bin/ng serve --host 0.0.0.0 --port 4200 > /tmp/ng-serve.log 2>&1 &

      - name: Wait for app
        run: |
          npx wait-on http-get://localhost:4200 --timeout 300000 --interval 3000 || \
          (echo "❌ wait-on failed, printing log:" && cat /tmp/ng-serve.log && exit 1)

      - name: Verify Angular is responding
        run: curl -f http://localhost:4200 || (cat /tmp/ng-serve.log && exit 1)

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 🔍 Debug Azure Playwright Service
        run: |
          echo "=== Token for Playwright Service ==="
          TOKEN=$(az account get-access-token --resource https://playwright.microsoft.com --query accessToken -o tsv)

          echo "=== Workspace HTTP Check ==="
          HTTP_CODE=$(curl -s -o /tmp/pw.json -w "%{http_code}" -H "Authorization: Bearer $TOKEN" "$PLAYWRIGHT_SERVICE_URL")
          echo "HTTP Status: $HTTP_CODE"
          cat /tmp/pw.json
        env:
          PLAYWRIGHT_SERVICE_URL: ${{ secrets.PLAYWRIGHT_SERVICE_URL }}

      - name: Run Smoke Tests (Azure Dashboard)
        run: npx playwright test --project=smoke-chromium -c playwright.service.config.ts
        env:
          CI: true
          DEBUG: pw:api
          PLAYWRIGHT_SERVICE_URL: ${{ secrets.PLAYWRIGHT_SERVICE_URL }}
          # Use SHA to ensure uniqueness and prevent "Test run creation failed"
          PLAYWRIGHT_SERVICE_RUN_ID: smoke-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-report
          path: playwright-report/
          retention-days: 14

  e2e-multi-browser:
    name: '🚀 E2E - ${{ matrix.browser }}'
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Set environment dynamically based on branch
    environment: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Staging' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            project: e2e-chromium
            deps: chromium
          - browser: firefox
            project: e2e-firefox
            deps: firefox
          - browser: webkit
            project: e2e-webkit
            deps: webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.deps }}
      - run: cd angular-app && npm ci

      - name: Start Angular app
        run: |
          cd angular-app
          node_modules/.bin/ng serve --host 0.0.0.0 --port 4200 > /tmp/ng-serve.log 2>&1 &

      - name: Wait for app
        run: |
          npx wait-on http-get://localhost:4200 --timeout 300000 --interval 3000 || \
          (echo "❌ wait-on failed, printing log:" && cat /tmp/ng-serve.log && exit 1)

      - name: Verify Angular is responding
        run: curl -f http://localhost:4200 || (cat /tmp/ng-serve.log && exit 1)

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run E2E Tests (Azure Dashboard)
        run: npx playwright test --project=${{ matrix.project }} -c playwright.service.config.ts --workers=4
        env:
          CI: true
          DEBUG: pw:api
          PLAYWRIGHT_SERVICE_URL: ${{ secrets.PLAYWRIGHT_SERVICE_URL }}
          # Use SHA to ensure uniqueness and prevent "Test run creation failed"
          PLAYWRIGHT_SERVICE_RUN_ID: e2e-${{ matrix.browser }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30
