name: Playwright E2E Tests

on:
  push:
    branches:
      - xguo-dev
      - development
      - testing
      - staging
      - production
      - 'releases/**'
  pull_request:
    branches:
      - development
      - testing
      - staging
      - production
      - 'releases/**'

# ─────────────────────────────────────────────────────────────
# BRANCH → JOB MATRIX
#
# Branch/Event                         | Job triggered
# -------------------------------------|-----------------------------
# push: xguo-dev                       | smoke-test
# push: development / testing /        | smoke-test
#        staging / production          |
# push: releases/**                    | e2e-multi-browser
# pull_request → any non-releases/**   | smoke-test
# pull_request → releases/**           | e2e-multi-browser
#
# ALL jobs report to Azure Playwright Service Dashboard.
# ─────────────────────────────────────────────────────────────

jobs:
  # ──────────────────────────────────────────────────────────────
  # SMOKE TEST
  # Runs on:  all non-releases/** branches + PRs targeting them
  # Tests:    smoke-chromium project only
  # Azure ID: smoke-<branch>-<run_id>-<attempt>
  # ──────────────────────────────────────────────────────────────
  smoke-test:
    name: '🔧 Smoke Test'
    if: |
      !startsWith(github.ref, 'refs/heads/releases/') &&
      !startsWith(github.base_ref, 'releases/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: cd angular-app && npm ci

      - name: Start Angular app
        run: |
          cd angular-app
          node_modules/.bin/ng serve --host 0.0.0.0 --port 4200 > /tmp/ng-serve.log 2>&1 &

      - name: Wait for app
        run: npx wait-on http-get://localhost:4200 --timeout 180000 --interval 2000 || (cat /tmp/ng-serve.log && exit 1)

      - name: Run Smoke Tests (Azure Dashboard)
        run: npx playwright test --project=smoke-chromium -c playwright.service.config.ts
        env:
          CI: true
          PLAYWRIGHT_SERVICE_URL: ${{ secrets.PLAYWRIGHT_SERVICE_URL }}
          PLAYWRIGHT_SERVICE_ACCESS_TOKEN: ${{ secrets.PLAYWRIGHT_SERVICE_ACCESS_TOKEN }}
          PLAYWRIGHT_SERVICE_RUN_ID: smoke-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # FULL E2E — MULTI-BROWSER
  # Runs on:  releases/** branches + PRs targeting releases/**
  # Tests:    e2e-chromium / e2e-firefox / e2e-webkit (parallel)
  # Azure ID: e2e-<browser>-<branch>-<run_id>-<attempt>
  # ──────────────────────────────────────────────────────────────
  e2e-multi-browser:
    name: '🚀 E2E - ${{ matrix.browser }}'
    if: |
      startsWith(github.ref, 'refs/heads/releases/') ||
      startsWith(github.base_ref, 'releases/')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            project: e2e-chromium
            deps: chromium
          - browser: firefox
            project: e2e-firefox
            deps: firefox
          - browser: webkit
            project: e2e-webkit
            deps: webkit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.deps }}
      - run: cd angular-app && npm ci

      - name: Start Angular app
        run: |
          cd angular-app
          node_modules/.bin/ng serve --host 0.0.0.0 --port 4200 > /tmp/ng-serve.log 2>&1 &

      - name: Wait for app
        run: npx wait-on http-get://localhost:4200 --timeout 180000 --interval 2000 || (cat /tmp/ng-serve.log && exit 1)

      - name: Run E2E Tests (Azure Dashboard)
        run: npx playwright test --project=${{ matrix.project }} -c playwright.service.config.ts
        env:
          CI: true
          PLAYWRIGHT_SERVICE_URL: ${{ secrets.PLAYWRIGHT_SERVICE_URL }}
          PLAYWRIGHT_SERVICE_ACCESS_TOKEN: ${{ secrets.PLAYWRIGHT_SERVICE_ACCESS_TOKEN }}
          PLAYWRIGHT_SERVICE_RUN_ID: e2e-${{ matrix.browser }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report-${{ matrix.browser }}-${{ github.run_id }}
          path: playwright-report/
          retention-days: 30

  # ──────────────────────────────────────────────────────────────
  # QUALITY GATE
  # Aggregates results — skipped jobs do NOT count as failure.
  # ──────────────────────────────────────────────────────────────
  quality-gate:
    name: '✅ Quality Gate'
    needs: [smoke-test, e2e-multi-browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate results
        run: |
          SMOKE="${{ needs.smoke-test.result }}"
          E2E="${{ needs.e2e-multi-browser.result }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Smoke Test:        $SMOKE"
          echo "  E2E Multi-Browser: $E2E"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          FAILED=false
          for result in "$SMOKE" "$E2E"; do
            if [ "$result" == "failure" ]; then FAILED=true; fi
          done
          if [ "$FAILED" = "true" ]; then
            echo "❌ Quality Gate FAILED"
            exit 1
          fi
          echo "✅ Quality Gate PASSED"
