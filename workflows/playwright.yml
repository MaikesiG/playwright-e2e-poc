name: Playwright E2E Tests

on:
  push:
    branches: [main, dev, xguo-dev]
  pull_request:
    branches: [main]

jobs:
  # ── Smoke Tests (Chromium only, fast) ──────────────────
  smoke:
    name: 'Smoke Tests - Chromium'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start Angular app
        run: node_modules/.bin/ng serve --host 0.0.0.0 &

      - name: Wait for Angular app to be ready
        run: npx wait-on http://localhost:4200 --timeout 60000

      - name: Run Smoke Tests
        run: npm run test:smoke
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-smoke
          path: playwright-report/
          retention-days: 30

  # ── E2E Chromium ───────────────────────────────────────
  e2e-chromium:
    name: 'E2E - Chromium'
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start Angular app
        run: node_modules/.bin/ng serve --host 0.0.0.0 &

      - name: Wait for Angular app to be ready
        run: npx wait-on http://localhost:4200 --timeout 60000

      - name: Run E2E Tests - Chromium
        run: npx playwright test --project=e2e-chromium
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-e2e-chromium
          path: playwright-report/
          retention-days: 30

  # ── E2E Firefox ────────────────────────────────────────
  e2e-firefox:
    name: 'E2E - Firefox'
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-firefox-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps firefox

      - name: Start Angular app
        run: node_modules/.bin/ng serve --host 0.0.0.0 &

      - name: Wait for Angular app to be ready
        run: npx wait-on http://localhost:4200 --timeout 60000

      - name: Run E2E Tests - Firefox
        run: npx playwright test --project=e2e-firefox
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-e2e-firefox
          path: playwright-report/
          retention-days: 30

  # ── E2E WebKit ─────────────────────────────────────────
  e2e-webkit:
    name: 'E2E - WebKit'
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-webkit-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps webkit

      - name: Start Angular app
        run: node_modules/.bin/ng serve --host 0.0.0.0 &

      - name: Wait for Angular app to be ready
        run: npx wait-on http://localhost:4200 --timeout 60000

      - name: Run E2E Tests - WebKit
        run: npx playwright test --project=e2e-webkit
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-e2e-webkit
          path: playwright-report/
          retention-days: 30

  # ── Quality Gate ───────────────────────────────────────
  quality-gate:
    name: '✅ Quality Gate'
    needs: [smoke, e2e-chromium, e2e-firefox, e2e-webkit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.smoke.result }}" != "success" ] || \
             [ "${{ needs.e2e-chromium.result }}" != "success" ] || \
             [ "${{ needs.e2e-firefox.result }}" != "success" ] || \
             [ "${{ needs.e2e-webkit.result }}" != "success" ]; then
            echo "❌ Quality Gate FAILED"
            exit 1
          fi
          echo "✅ Quality Gate PASSED - all browsers green"

  # ── Deploy Report to GitHub Pages ──────────────────────
  deploy-report:
    name: '📊 Deploy Playwright Report'
    needs: [smoke, e2e-chromium, e2e-firefox, e2e-webkit]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: report-e2e-chromium
          path: playwright-report/

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
