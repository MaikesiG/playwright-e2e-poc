name: Playwright E2E Tests

on:
  push:
    branches: [main, dev, xguo-dev]
  pull_request:
    branches: [main]

jobs:
  # ── Smoke Tests (Chromium only, fast) ──────────────────
  smoke:
    name: 'Smoke Tests - Chromium'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
        env:
          CI: true
          BASE_URL: ${{ vars.BASE_URL || 'https://playwright.dev' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-smoke
          path: playwright-report/
          retention-days: 30

  # ── E2E Chromium ───────────────────────────────────────
  e2e-chromium:
    name: 'E2E - Chromium'
    needs: smoke # smoke pass then run E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=e2e-chromium
        env:
          CI: true
          BASE_URL: ${{ vars.BASE_URL || 'https://playwright.dev' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-e2e-chromium
          path: playwright-report/
          retention-days: 30

  # ── E2E Firefox ────────────────────────────────────────
  e2e-firefox:
    name: 'E2E - Firefox'
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      - run: npx playwright test --project=e2e-firefox
        env:
          CI: true
          BASE_URL: ${{ vars.BASE_URL || 'https://playwright.dev' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-e2e-firefox
          path: playwright-report/
          retention-days: 30

  # ── E2E WebKit ─────────────────────────────────────────
  e2e-webkit:
    name: 'E2E - WebKit'
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test --project=e2e-webkit
        env:
          CI: true
          BASE_URL: ${{ vars.BASE_URL || 'https://playwright.dev' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-e2e-webkit
          path: playwright-report/
          retention-days: 30

  # ── Quality Gate ───────────────────────────────────────
  quality-gate:
    name: '✅ Quality Gate'
    needs: [smoke, e2e-chromium, e2e-firefox, e2e-webkit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.smoke.result }}" != "success" ] || \
             [ "${{ needs.e2e-chromium.result }}" != "success" ] || \
             [ "${{ needs.e2e-firefox.result }}" != "success" ] || \
             [ "${{ needs.e2e-webkit.result }}" != "success" ]; then
            echo "❌ Quality Gate FAILED"
            exit 1
          fi
          echo "✅ Quality Gate PASSED - all browsers green"
