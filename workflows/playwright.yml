name: Playwright E2E Tests

on:
  push:
    branches: [main, dev, xguo-dev]
  pull_request:
    branches: [main]
  workflow_dispatch: # manual trigger
    inputs:
      environment:
        description: 'Environment to test'
        required: true
        default: 'dev'
        type: choice
        options: [dev, staging, prod]

jobs:
  # ─── JOB 1: Chromium ──────────────────────────────────
  test-chromium:
    name: 'Tests - Chromium'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests on Chromium
        run: npx playwright test --project=chromium
        env:
          CI: true
          BASE_URL: ${{ vars.BASE_URL || 'https://playwright.dev' }}

      - name: Upload Chromium report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-chromium
          path: playwright-report/
          retention-days: 30

  # ─── JOB 2: Firefox ───────────────────────────────────
  test-firefox:
    name: 'Tests - Firefox'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Firefox
        run: npx playwright install --with-deps firefox

      - name: Run tests on Firefox
        run: npx playwright test --project=firefox
        env:
          CI: true
          BASE_URL: ${{ vars.BASE_URL || 'https://playwright.dev' }}

      - name: Upload Firefox report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-firefox
          path: playwright-report/
          retention-days: 30

  # ─── JOB 3: WebKit (Safari) ───────────────────────────
  test-webkit:
    name: 'Tests - WebKit'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install WebKit
        run: npx playwright install --with-deps webkit

      - name: Run tests on WebKit
        run: npx playwright test --project=webkit
        env:
          CI: true
          BASE_URL: ${{ vars.BASE_URL || 'https://playwright.dev' }}

      - name: Upload WebKit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-webkit
          path: playwright-report/
          retention-days: 30

  # ─── JOB 4: Quality Gate ──────────────────────────────
  quality-gate:
    name: 'Quality Gate'
    runs-on: ubuntu-latest
    needs: [test-chromium, test-firefox, test-webkit] # wait for all test jobs to finish
    if: always()
    steps:
      - name: Check all browsers passed
        run: |
          if [ "${{ needs.test-chromium.result }}" != "success" ] || \
             [ "${{ needs.test-firefox.result }}" != "success" ] || \
             [ "${{ needs.test-webkit.result }}" != "success" ]; then
            echo "❌ Quality Gate FAILED - not all browsers passed"
            exit 1
          fi
          echo "✅ Quality Gate PASSED - all browsers green"
